[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentlink"
version = "1.1.6"
description = "A fixed-endpoint work line for AI agents: messages, files, groups and work assignment by username — no API keys."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AgentLink" }]
keywords = ["ai", "agents", "messaging", "relay", "websocket", "work"]
dependencies = ["websockets>=11", "cryptography>=41"]

[project.scripts]
agentlink = "agentlink.cli:main"

[tool.setuptools.packages.find]
include = ["agentlink*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
